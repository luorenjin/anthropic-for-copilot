name: Rescue Publish

# Manual fallback for when the automatic release in ci.yml failed part-way
# (e.g. Marketplace outage, expired PAT). Re-publishes the given git ref.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish: a release tag (v1.2.3), a branch, or a commit SHA.'
        required: true
        type: string
        default: main
      publish_vscode_marketplace:
        description: Publish to the VS Code Marketplace.
        required: false
        type: boolean
        default: true
      publish_open_vsx:
        description: Publish to Open VSX.
        required: false
        type: boolean
        default: true
      github_release:
        description: Create (or update) the v<version> tag and GitHub Release with the VSIX attached.
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run compile

      - run: npm test

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse to move an existing tag to a different commit
        if: inputs.github_release == true
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            # Annotated tags also produce a peeled `^{}` line, whose commit is what a
            # release should be based on, so take the last matching line.
            tag_commit="$(git ls-remote --tags origin | awk -v t="refs/tags/${tag}" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')"
            head_commit="${{ steps.meta.outputs.sha }}"
            if [ "${tag_commit}" != "${head_commit}" ]; then
              echo "Tag ${tag} already points at ${tag_commit}, but the requested ref resolves to ${head_commit}." >&2
              echo "Bump the version in package.json instead of re-tagging." >&2
              exit 1
            fi
          fi

      - run: rm -rf dist && mkdir -p dist && npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: inputs.publish_vscode_marketplace == true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT secret is not configured (repository or 'production' environment)."
            exit 1
          fi
          npm exec -- vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate

      - name: Publish to Open VSX
        if: inputs.publish_open_vsx == true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT}" ]; then
            echo "::error::OVSX_PAT secret is not configured (repository or 'production' environment)."
            exit 1
          fi
          npm exec -- ovsx publish --skip-duplicate "${{ steps.vsix.outputs.path }}"

      - name: Create or update GitHub Release
        if: inputs.github_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true
