name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run compile

      - run: npm test

      # A release happens when a push to main carries a package.json version whose
      # tag (v<version>) does not exist yet — bumping the version is the only action
      # needed to trigger a publish once this build is green.
      - name: Resolve version and release decision
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          should_release=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1 || status=$?
            case "${status}" in
              0) echo "Tag ${tag} already exists; nothing to release." ;;
              2) should_release=true
                 echo "Tag ${tag} does not exist yet; this build will be released." ;;
              *) echo "::error::Could not determine whether tag ${tag} exists (git ls-remote exited ${status})." >&2
                 exit 1 ;;
            esac
          fi
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

          if [ "${should_release}" = "true" ]; then
            echo "::notice::${tag} will be published to the VS Code Marketplace and Open VSX once this build is green."
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "::notice::package.json version ${version} was already released (${tag} exists); nothing will be published. Bump the version to publish again."
          fi

      - run: mkdir -p dist && npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: anthropic-for-copilot-${{ steps.meta.outputs.tag }}
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Publish the exact VSIX that the build job validated instead of rebuilding.
      - uses: actions/download-artifact@v4
        with:
          name: anthropic-for-copilot-${{ needs.build.outputs.tag }}
          path: dist

      - name: Locate and verify VSIX
        id: vsix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          packaged="$(unzip -p "${files[0]}" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "${packaged}" != "${RELEASE_VERSION}" ]; then
            echo "VSIX version ${packaged} does not match package.json version ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: node .github/scripts/extract-release-notes.mjs "$RELEASE_VERSION" dist/RELEASE_NOTES.md

      # Step-level `if` conditions cannot read the `env` context, so credentials are
      # probed here and exposed as an output instead.
      - name: Resolve publish targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ vars.PUBLISH_VSCODE_MARKETPLACE }}" = "false" ]; then
            echo "vscode_marketplace=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT secret is not configured (repository or 'production' environment)." >&2
            exit 1
          else
            echo "vscode_marketplace=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ vars.PUBLISH_OPEN_VSX }}" = "false" ]; then
            echo "open_vsx=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${OVSX_PAT}" ]; then
            echo "::warning::OVSX_PAT secret is not configured; Open VSX publish will be skipped."
            echo "open_vsx=false" >> "$GITHUB_OUTPUT"
          else
            echo "open_vsx=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: steps.targets.outputs.vscode_marketplace == 'true'
        run: npm exec -- vsce publish --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate

      - name: Publish to Open VSX
        if: steps.targets.outputs.open_vsx == 'true'
        run: npm exec -- ovsx publish --skip-duplicate "${{ steps.vsix.outputs.path }}"

      # Creates the v<version> tag on this commit and the GitHub Release with the VSIX attached.
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "## Released ${RELEASE_TAG}"
            echo
            echo "- VSIX: \`${{ steps.vsix.outputs.path }}\`"
            echo "- VS Code Marketplace: ${{ steps.targets.outputs.vscode_marketplace == 'true' && 'published' || 'skipped' }}"
            echo "- Open VSX: ${{ steps.targets.outputs.open_vsx == 'true' && 'published' || 'skipped' }}"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
